spring:
  application:
    name: llm-gateway
  main:
    banner-mode: "off"

server:
  port: 8080
  shutdown: graceful

# why ECS structured logging instead of logstash-logback-encoder: Spring Boot 3.4+ ships
# structured logging natively, so we get one JSON object per line — MDC entries included —
# with zero extra dependencies and no logback-spring.xml to maintain. trace_id lands in the
# MDC automatically once OpenTelemetry is wired in M8, which is what makes log-to-trace
# correlation work.
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    io.github.mehmetztrk.llmgateway: INFO

resilience4j.circuitbreaker:
  configs:
    default:
      # Percentage-based rather than a raw count: a provider serving 10 000 requests a minute and
      # one serving 10 should trip on the same *proportion* of failures, not the same number.
      failureRateThreshold: 50
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 20
      # Below this many calls the breaker stays closed regardless of failure rate. Without it, the
      # first two requests after start-up could open a breaker on a perfectly healthy provider.
      minimumNumberOfCalls: 10
      waitDurationInOpenState: 5s
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      registerHealthIndicator: true
  instances:
    ollama-primary:
      baseConfig: default
    ollama-secondary:
      baseConfig: default
    mock:
      baseConfig: default
    mock-standby:
      baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    build:
      enabled: true
    java:
      enabled: true

spring.datasource:
  url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:llmgw}
  username: ${POSTGRES_USER:llmgw}
  password: ${POSTGRES_PASSWORD:llmgw}
  hikari:
    # Small on purpose. Every connection is held only for the microseconds a key lookup takes,
    # and an oversized pool just moves contention from the application into Postgres.
    maximum-pool-size: 10
    pool-name: llmgw-pool

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  # Connection-level timeout. The per-operation budget is gateway.rate-limit.timeout, which is
  # deliberately tighter: the limiter runs before every request and must not add its own latency.
  timeout: 2s

spring.flyway:
  enabled: true
  locations: classpath:db/migration

gateway:
  security:
    # Mixed into every key digest and never stored in the database, so a database dump alone
    # cannot verify a guessed key. MUST be overridden outside local development.
    key-pepper: ${GATEWAY_KEY_PEPPER:change-me-in-production}
    # This value is the revocation SLA for changes made by another replica.
    cache-ttl: 60s
    cache-max-size: 10000
    # Unset by default: a deployment with no configured key fails closed rather than shipping a
    # well-known default credential.
    bootstrap-admin-key: ${GATEWAY_BOOTSTRAP_ADMIN_KEY:}
    bootstrap-tenant-key: ${GATEWAY_BOOTSTRAP_TENANT_KEY:}

  routing:
    probe-interval: 10s
    probe-timeout: 2s
    # One failure is noise; three in a row is a pattern worth acting on.
    failure-threshold: 3
    aliases:
      # An alias says what the client wants, not where to get it. That indirection is what makes
      # failover expressible: without it, "fail over" would mean silently answering with a
      # different model than the one the client named.
      chat-default:
        - provider: ollama-primary
          model: qwen2.5:1.5b-instruct
        - provider: ollama-secondary
          model: llama3.2:1b
      # Two mock targets so failover can be demonstrated with no GPU and no network at all.
      mock-ha:
        - provider: mock
          model: mock-fast
        - provider: mock-standby
          model: mock-fast

  rate-limit:
    # Short on purpose: a slow Redis must fail fast rather than add latency to every request.
    # Exceeding it refuses the request — the limiter fails closed. See ADR-0004.
    timeout: 250ms

  observability:
    # Never enable outside local debugging. See GatewayProperties.Observability#logPrompts.
    log-prompts: false

  providers:
    # Map keys become the provider id used in logs, metrics and ledger rows.
    ollama:
      ollama-primary:
        base-url: ${OLLAMA_PRIMARY_URL:http://localhost:11434}
        models:
          - qwen2.5:1.5b-instruct
          - nomic-embed-text
        timeout: 60s
      ollama-secondary:
        base-url: ${OLLAMA_SECONDARY_URL:http://localhost:11435}
        models:
          - llama3.2:1b
        timeout: 120s # CPU-only, so it is legitimately slower than the primary

    # The mock never talks to a model. Every benchmark number is measured against it, because a
    # real model's variance dwarfs the gateway overhead under test.
    mock:
      enabled: true
      models:
        - mock-fast
        - mock-echo
      latency: 0ms
      completion-tokens: 32
      error-rate: 0.0
      seed: 42

    # The failover target for the mock-ha alias. A different seed so its answers are visibly its
    # own — a failover you cannot see happen is one you cannot demonstrate.
    mock-standby:
      enabled: true
      models:
        - mock-fast
        - mock-echo
      latency: 0ms
      completion-tokens: 32
      error-rate: 0.0
      seed: 4242
