spring:
  application:
    name: llm-gateway
  main:
    banner-mode: "off"

server:
  port: 8080
  shutdown: graceful

# why ECS structured logging instead of logstash-logback-encoder: Spring Boot 3.4+ ships
# structured logging natively, so we get one JSON object per line — MDC entries included —
# with zero extra dependencies and no logback-spring.xml to maintain. trace_id lands in the
# MDC automatically once OpenTelemetry is wired in M8, which is what makes log-to-trace
# correlation work.
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    io.github.mehmetztrk.llmgateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    build:
      enabled: true
    java:
      enabled: true

gateway:
  observability:
    # Never enable outside local debugging. See GatewayProperties.Observability#logPrompts.
    log-prompts: false
