name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch: a green result for an old commit is noise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    # ubuntu-latest ships a working Docker daemon, which is what Testcontainers needs from M3 on.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Restores the Gradle dependency and build caches and writes them back on the default
      # branch only, so PRs read from cache without racing to poison it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify formatting
        run: ./gradlew spotlessCheck

      - name: Build and test
        run: ./gradlew check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: ignore
